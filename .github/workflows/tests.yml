name: Android tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verificar parser e gate do summary
        run: python3 scripts/summary.py --self-test
      - name: Verificar arquivos versionados
        shell: bash
        run: |
          tracked=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$tracked" ]; then
            printf 'Arquivos ignorados versionados:\n%s\n' "$tracked"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: cp .env.example .env
      - name: Install Maestro 2.11.0 and download official app
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip -o /tmp/maestro.zip
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro-cli"
          chmod +x "$HOME/.maestro-cli/maestro/bin/maestro"
          echo "$HOME/.maestro-cli/maestro/bin" >> "$GITHUB_PATH"
          python -c "from dotenv import load_dotenv; import os, urllib.request; load_dotenv(); urllib.request.urlretrieve(os.environ['APP_URL'], 'app.apk')"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        id: tests
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install app.apk
            python run_tests.py
      - name: Resumo dos testes e completude
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          EXPECTED_TESTS: '5'
          JUNIT_PATTERN: 'results/junit.xml'
          SUMMARY_FILE: 'results/summary.md'
          TEST_SCOPE: 'Android 34 / Maestro / My Demo App 2.3.0. Sem iOS ou pagamento real.'
        run: python3 scripts/summary.py
      - uses: actions/upload-artifact@v4
        id: artifact
        if: always()
        with:
          name: android-results
          path: results/
          retention-days: 7
          if-no-files-found: error
      - name: Link dos resultados
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[Baixar relatórios e evidências](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nArtifact indisponível; confira a etapa de upload.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
