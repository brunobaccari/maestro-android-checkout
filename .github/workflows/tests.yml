name: Android tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verificar arquivos versionados
        shell: bash
        run: |
          tracked=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$tracked" ]; then
            printf 'Arquivos ignorados versionados:\n%s\n' "$tracked"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: cp .env.example .env
      - name: Install Maestro 2.11.0 and download official app
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip -o /tmp/maestro.zip
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro-cli"
          chmod +x "$HOME/.maestro-cli/maestro/bin/maestro"
          echo "$HOME/.maestro-cli/maestro/bin" >> "$GITHUB_PATH"
          python -c "from dotenv import load_dotenv; import os, urllib.request; load_dotenv(); urllib.request.urlretrieve(os.environ['APP_URL'], 'app.apk')"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        id: tests
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install app.apk
            python run_tests.py
      - name: Publish test summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path('results/junit.xml')
          cases, problem = [], ''
          try:
              cases = list(ET.parse(report).getroot().iter('testcase'))
              if not cases:
                  problem = 'No test cases were recorded; execution is unconfirmed.'
          except (OSError, ET.ParseError):
              problem = 'JUnit report missing or invalid; execution is unconfirmed.'
          failed = sum(c.find('failure') is not None or c.get('status') == 'FAILURE' for c in cases)
          errors = sum(c.find('error') is not None for c in cases)
          skipped = sum(c.find('skipped') is not None or c.get('status') == 'SKIPPED' for c in cases)
          summary = (
              '## Android checkout — Maestro\n\n'
              f"Execution step: **{os.environ.get('TEST_OUTCOME', 'unknown')}**\n\n"
              '| Total | Passed | Failed | Errors | Skipped |\n'
              '| --- | --- | --- | --- | --- |\n'
              f'| {len(cases)} | {len(cases) - failed - errors - skipped} | {failed} | {errors} | {skipped} |\n\n'
              f'{problem}\n\n'
              'Download **android-results** below for JUnit, flow logs and available screenshots. Retention: 7 days.\n\n'
              'Scope: Android 34 emulator / My Demo App 2.3.0. No iOS, physical-device or real-payment validation.\n'
          )
          report.parent.mkdir(parents=True, exist_ok=True)
          (report.parent / 'summary.md').write_text(summary, encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(summary)
          if problem:
              raise SystemExit(problem)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: results/
          retention-days: 7
          if-no-files-found: error
